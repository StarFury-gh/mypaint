services:
  db:
    build: ./infra/db/
    ports:
      - 5432:5432
    container_name: db
    volumes:
      - db_volume:/var/lib/postgresql
    networks:
      - internal

  backend:
    build: ./backend/
    container_name: backend
    volumes:
      - backend_volume:/app/src/saved
    networks:
      - internal
      - external

  frontend:
    build: ./frontend
    container_name: frontend
    networks:
      - external
    ports:
      - 8080:80

volumes:
  db_volume:
  backend_volume:

networks:
  external:
    driver: bridge

  internal:
    driver: bridge
